<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalama - Türkiye'nin Balıkçı Ağı</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Koyu deniz mavisi arka plan */
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo-placeholder {
            width: 120px;
            height: 120px;
            background-color: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border: 3px solid #38bdf8;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #0ea5e9; /* Canlı mavi buton */
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- İstersen logonu buraya img etiketiyle ekleyebilirsin -->
        <div class="logo-placeholder">
            <span style="font-size: 2rem;">🎣</span>
        </div>
        
        <h1>KALAMA.TR</h1>
        <p>Doğada Bir Adım <br> Türkiye'nin Amatör Deniz Balıkçılığı Radar ve Harita Platformu</p>
        
        <!-- İşte asıl uygulamana (app.kalama.tr) yönlendiren sihirli buton -->
        <a href="https://app.kalama.tr" class="btn">Uygulamaya Git & Giriş Yap</a>
    </div>
</body>
</html>
